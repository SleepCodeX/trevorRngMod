name: Fabric 26.2 build and production client validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build, test and verify production bytecode
        # Minecraft 26.2 is unobfuscated: jar is the installable Loom output.
        run: bash ./gradlew clean build check --no-daemon
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-utils
      - name: Launch production JAR and test commands and HUD in Minecraft
        run: bash ./gradlew runProductionClientGameTest --no-daemon
      - name: Read candidate version
        id: candidate
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Upload installable candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: trevor-roll-${{ steps.candidate.outputs.version }}-mc26.2-loader0.19.5
          path: build/libs/trevor-roll-${{ steps.candidate.outputs.version }}.jar
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            build/verification/
            build/reports/
            build/preview/
            build/run/productionClientGameTest/logs/
            build/run/productionClientGameTest/screenshots/

  publish_1_8_0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the authorized release version
        id: version
        run: |
          if test "$(sed -n 's/^version=//p' gradle.properties)" = '1.8.0'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: trevor-roll-1.8.0-mc26.2-loader0.19.5
          path: release-assets
      - name: Verify and checksum the tested JAR
        if: steps.version.outputs.publish == 'true'
        run: |
          python - <<'PYVERIFY'
          from pathlib import Path
          import hashlib, json, zipfile
          p = Path('release-assets/trevor-roll-1.8.0.jar')
          with zipfile.ZipFile(p) as z:
              assert json.loads(z.read('fabric.mod.json'))['version'] == '1.8.0'
              assert 'dev/trevorroll/ElusiveRewardPainter.class' in z.namelist()
              assert not any(n.startswith(('net/minecraft/', 'net/fabricmc/')) for n in z.namelist())
          p.with_name(p.name + '.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PYVERIFY
      - name: Publish 1.8.0 and mark Latest
        if: steps.version.outputs.publish == 'true'
        run: |
          if gh release view 1.8.0 --json isDraft --jq .isDraft > /tmp/trevor-release-state; then
            if test "$(cat /tmp/trevor-release-state)" = false; then
              echo '1.8.0 is already published; preserving its assets.'
              exit 0
            fi
          else
            gh release create 1.8.0 --draft --target "$GITHUB_SHA" --title 'Trevor Roll 1.8.0' --notes-file RELEASE-NOTES.md
          fi
          gh release upload 1.8.0 release-assets/trevor-roll-1.8.0.jar release-assets/trevor-roll-1.8.0.jar.sha256 --clobber
          gh release edit 1.8.0 --draft=false --prerelease=false --latest --title 'Trevor Roll 1.8.0' --notes-file RELEASE-NOTES.md
