name: Fabric 26.2 build and production client validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build, test and verify production bytecode
        # Minecraft 26.2 is unobfuscated: jar is the installable Loom output.
        run: bash ./gradlew clean build check --no-daemon
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-utils
      - name: Launch production JAR and test commands and HUD in Minecraft
        run: bash ./gradlew runProductionClientGameTest --no-daemon
      - name: Upload installable candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: trevor-roll-1.3.1-dev-mc26.2-loader0.19.5
          path: build/libs/trevor-roll-1.3.1-dev.jar
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            build/verification/
            build/reports/
            build/run/productionClientGameTest/logs/
            build/run/productionClientGameTest/screenshots/

  publish_candidate:
    name: Publish validated 1.3.1-dev prerelease
    needs: build
    # One-shot authorization: only the immediate transition from this exact
    # reviewed source commit can publish. Future branch pushes cannot run it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/crest-hud-fabric-build' && github.event.before == '02fd8899c42f92cf2db06e5eb776583296d5751c'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trevor-roll-1.3.1-dev-mc26.2-loader0.19.5
          path: candidate
      - name: Publish the tested JAR without changing main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: '02fd8899c42f92cf2db06e5eb776583296d5751c'
        shell: bash
        run: |
          set -euo pipefail
          TAG=1.3.1-dev
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its tag and assets."
            exit 0
          fi
          (cd candidate && sha256sum trevor-roll-1.3.1-dev.jar > trevor-roll-1.3.1-dev.jar.sha256)
          gh release create "$TAG" \
            candidate/trevor-roll-1.3.1-dev.jar \
            candidate/trevor-roll-1.3.1-dev.jar.sha256 \
            --target "$RELEASE_COMMIT" \
            --title '1.3.1-dev trevorRollMod' \
            --prerelease \
            --notes-file RELEASE-NOTES.md
